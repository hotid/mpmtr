name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: vet and gofmt
        run: make vet
      - name: unit and scenario tests
        run: go test ./...
      - name: race
        run: go test -race ./...
      - name: build (amd64, arm64)
        run: |
          make build
          GOARCH=arm64 CGO_ENABLED=0 go build ./...
      - name: man pages render
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends man-db groff-base
          make man-check
